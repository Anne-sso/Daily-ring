<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Ring</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .card {
      position: relative;
      width: 90vw;
      max-width: 420px;
      aspect-ratio: 3 / 4;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    }
    .bg-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 24px 20px;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
      color: #ffffff;
    }
    .day-badge {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f3c262;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .date-sub {
      font-size: 0.9rem;
      color: #e0e0e0;
      margin-top: 3px;
    }
    .name-tag {
      font-size: 1.05rem;
      margin-top: 12px;
      font-weight: 500;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="IMG_8beada11-caaf-4331-a69e-4c5eedfe43a4.jpg" alt="Gold Ring" class="bg-img">
    
    
    <div class="overlay">
      <div id="day-display" class="day-badge">Today</div>
      <div id="date-display" class="date-sub">Loading...</div>
      <div class="name-tag">Crafted for: <strong>Sameer</strong></div>
    </div>
  </div>

  <script>
    function updateDateInfo() {
      const now = new Date();
      document.getElementById('day-display').textContent = now.toLocaleDateString(undefined, { weekday: 'long' });
      document.getElementById('date-display').textContent = now.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
    }
    updateDateInfo();
    setInterval(updateDateInfo, 60000);
  </script>
</body>
</html>
